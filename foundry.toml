[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Without this, `forge inspect ... storage-layout` adds storageLayout to the
# output selection and invalidates the build cache, so the next `forge build`
# recompiles every file (3.26s vs 0.11s).
extra_output = ["storageLayout"]

[profile.ci]
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

[profile.snapshot]
no_match_test = "^invariant_"

[lint]
exclude_lints = ["mixed-case-function", "mixed-case-variable"]



# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
