[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.36"
optimizer = true
optimizer_runs = 200
# Without this, `forge inspect ... storage-layout` adds storageLayout to the
# output selection and invalidates the build cache, so the next `forge build`
# recompiles every file (3.26s vs 0.11s).
extra_output = ["storageLayout"]

[profile.snapshot]
# RPC-dependent fork tests are rehearsed separately, not included in deterministic gas snapshots.
no_match_contract = "StateOracleUpgradeForkTest"

[lint]
exclude_lints = ["mixed-case-function", "mixed-case-variable"]



# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
