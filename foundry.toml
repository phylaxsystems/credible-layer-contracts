[profile.default]
src = "src"
out = "out"
libs = ["lib"]

[profile.ci]
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

[profile.snapshot]
no_match_test = "^invariant_"

[lint]
exclude_lints = ["mixed-case-function", "mixed-case-variable"]

[invariant]
runs = 256
depth = 128
fail_on_revert = true
show_metrics = false



# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
