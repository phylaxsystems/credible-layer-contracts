name: Docker GHCR Push - Contracts Utils

on:
  push:
    branches:
    - main
    - linea
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    uses: ./.github/workflows/qualify-publication.yml

  docker-ghcr-push:
    needs: qualify
    permissions:
      packages: write
      contents: read
    uses: phylaxsystems/actions/.github/workflows/release-docker-ghcr.yaml@main
    with:
      rust-binary-name: contracts-utils-${{ github.ref_name }}
      requires-private-deps: false
      dockerfile-path: Dockerfile
