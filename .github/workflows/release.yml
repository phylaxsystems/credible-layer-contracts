name: Release and Publish

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to retry on npm
        required: true
        type: string

env:
  ARTIFACTS_PATH: "artifacts/"

jobs:
  create-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Create artifacts
        run: ./shell/create_artifacts.sh
      - name: Upload artifact directory
        uses: actions/upload-artifact@v4
        with:
          name: credible-layer-contracts-artifacts
          path: artifacts/
  release-npm:
    needs: create-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: phylaxsystems/actions/release-npm@main
        with:
          artifact_name: credible-layer-contracts-artifacts
          artifacts_path: artifacts/
          ignore_scripts: true
          release_tag: ${{ inputs.release_tag }}
  release-github:
    needs: create-artifacts
    if: github.event_name == 'push'
    permissions:
      contents: write
    uses: phylaxsystems/actions/.github/workflows/release-github.yaml@main
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    with:
      artifact_name: credible-layer-contracts-artifacts
